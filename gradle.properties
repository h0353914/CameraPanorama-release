org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.java.home=/home/h/lineageos/prebuilts/jdk/jdk11/linux-x86

# 建構效能
org.gradle.parallel=true
org.gradle.caching=true

# 原始 APK 使用 androidx（3.0.1.B.0.0 相較舊版 2.3.1.B.0.6 已從 Support Library
# 遷移到 androidx），直接沿用官方 androidx Maven 構件即可，不需要像舊版
# java-2.3.1.B.0.6-a9 分支那樣手動抽取 classes.jar 迴避資源合併問題。
android.useAndroidX=true
android.enableJetifier=false
